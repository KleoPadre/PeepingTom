name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Wireshark CLI on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install wireshark

      - name: Install Wireshark CLI on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark wireshark-common

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: mypy
        run: mypy src

      - name: CLI smoke
        run: |
          wispwire --help
          wispwire doctor
          wispwire interfaces || true
          wispwire open --help
          wispwire capture --help
