[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wispwire"
version = "0.1.0"
description = "Терминальная утилита для диагностики сетевого анализа"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
wispwire = "wispwire.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wispwire"]

[tool.pytest.ini_options]
pythonpath = ["src"]

