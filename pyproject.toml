[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wispwire"
version = "0.1.0"
description = "Терминальная утилита для диагностики сетевого анализа"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Levon Osipov" },
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<15",
    "textual>=0.80,<2",
]

[project.urls]
Homepage = "https://github.com/KleoPadre/WispWire"
Repository = "https://github.com/KleoPadre/WispWire"
Issues = "https://github.com/KleoPadre/WispWire/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
wispwire = "wispwire.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wispwire"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wispwire",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
